@keyframes ve-spin { to { transform: rotate(360deg); } }
.animate-spin { animation: ve-spin 1s linear infinite; }
@keyframes ve-fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ve-fade { animation: ve-fadeIn .3s ease both; }
.ve-panel { animation: ve-fadeIn .24s ease both; }
@keyframes ve-glowPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.ve-pulse { animation: ve-glowPulse 1.6s ease-in-out infinite; }

.ve-btn:hover:not(:disabled) { filter: brightness(1.14); }
.ve-btn:active:not(:disabled) { transform: scale(0.97); }
.ve-btn:focus-visible { outline: 2px solid ${w.blue}; outline-offset: 2px; }
.ve-drop { transition: border-color .18s ease, background .18s ease, box-shadow .18s ease; }
.ve-chip { transition: background .15s ease, border-color .15s ease, opacity .15s ease, color .15s ease; }
.ve-elcard { transition: border-color .15s ease, background .15s ease, opacity .2s ease; cursor: pointer; }
.ve-elcard:hover { border-color: rgba(255,255,255,0.22); }
.ve-tab { transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease; }
.ve-tab:hover:not(:disabled) { background: rgba(140,155,255,0.10) !important; }
.ve-editor-grid { display: grid; grid-template-columns: 76px minmax(0, 1fr) 356px; gap: 14px; align-items: start; }
.ve-rail { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 10px; }
@media (max-width: 1140px) {
  .ve-editor-grid { grid-template-columns: minmax(0, 1fr); }

k opens a guided seven-step flow: style, product or typed description, length (which sets the scene budget), the SCRIPT REVIEW GATE where Claude writes a hook plus per-scene visual directions plus a call to action and nothing renders until the customer approves it, the frame prompts, the ElevenLabs sound (narration voiceover, background music, an optional sound-effects brief and an optional captions toggle, all previewable first), then generate. The server pipeline renders every shot, joins them, and lays the narration, music, sound effects and optional burned-in captions over the film in a final pass, with a .SRT caption file alongside. A Saved Videos tab is the unified, self-healing gallery of every finished video from both flows, persisted in the database; a Product Launch film gets the same sound and captions step from a Sound button on its card. Once initiated, the production pipeline self-drives to completion in the background \u2014 a 5-minute server sweep adopts finished renders and submits the next shot even with the tab closed.",icon:"Rocket",component:"apps/ProductStudio/App.tsx"},{id:"video-enhancer",name:"Video Enhancer",description:`Full AI editing suite for footage you already have, in a dark editor around a centered preview. Analyze: an AI vision model watches sampled frames, reports smart findings (a supporting chart appears only when a finding carries a score, comparison, recommendation or multi-step explanation \u2014 plain findings stay text) and designs adaptive graphic overlays for that exact content \u2014 motion-path arrows, callouts with leader lines, numbered step badges, pulsing highlight rings, labels and mini flow diagrams (strictly graphics, never captions), each previewing live, color-coded, toggleable and click-to-seek. Full toolset: trim/cut with draggable in/out timeline handles, split-at-playhead and per-segment keep/cut; brightness/contrast/saturation/blur/vignette filters plus 0.5\xD7\u20132\xD7 speed; draggable timed text overlays with size, color and duration; 16:9, 9:16, 1:1 and 4:5 aspect presets as a centered cover-crop; original-audio mute/volume; and an ElevenLabs music bed from a mood prompt or preset style with a music-vs-original volume slider (uses the founder's ELEVENLABS_API_KEY when configured, built-in engine otherwise). Export composites the whole edit in one pass into a downloadable MP4 (or WebM) with High/Standard/Compact quality options; the output is stored durably and replaces the raw upload in the player with a View-original toggle. Also the handoff target for SceneForge: a finished SceneForge video opened "in the Editor" or "sent to the Enhancer" loads here automatically, ready to trim, overlay, rescore or enhance.`,icon:"Sparkles",component:"apps/VideoEnhancer/App.tsx"},{id:"script-to-video",name:"Script-to-Video",description:"The 10-stage autonomous pipeline: give it a word, a line, a whole script (never rewritten), an uploaded script file, or a product URL \u2014 come back to a finished video. It writes the script, freezes a scene plan, generates a character bible with a likeness guard, films every scene with the SAME character (chained last-frame, drawn bookends, or auto-picked strategy), has an AI judge check every clip and repair failures once with a rewritten prompt (Omni fallback \u2014 never a blind retry), then assembles one MP4 with the joins checked. A live Render room shows the machine working; runs survive tab-close and a 5-minute background sweep recovers stalls (a judge that returns no verdict within 15 minutes auto-advances the scene on trust). Review offers per-clip verdicts and regeneration; Finish offers opt-in captions, end card and music (keep the film's own sound or rescore \u2014 dialogue always stays the model's). Pick a target length (15s/30s/45s/60s/90s/120s \u2014 default 30s) and a model (Veo 3.1 fast default, Omni Flash fallback). The length is a starting point, not a gate: each shot is budgeted from the words it actually speaks, and a script that reads longer than the pick expands the film to fit it (up to a 120s ceiling) instead of being rejected. The blueprint shows the planned shot count, the real running time and the estimated credit cost for you to confirm or cancel before rendering. Legacy projects stay accessible in the Library.",icon:"Clapperboard",component:"apps/ScriptToVideo/App.tsx"},{id:"sceneforge",name:"SceneForge",description:"SceneForge v2 is an eight-step avatar-first explainer studio coordinated by Verger: topic and deep-research script, editable script approval, live HeyGen v3 avatar/voice controls, four new visual systems plus archived styles, timestamped supporting-scene planning driven by the script writer's own per-beat image briefs, a live pipeline board where each scene card shows its own thumbnail and status the moment that scene's image lands (Images X/Y \xB7 Code X/Y, with Assemble locked until every scene has both), audio-preserving assembly with six quality checks, an inline player so the finished film is watchable before download, an ElevenLabs music bed with its own audio preview that is mixed under a 16:9 master, and scene-level editor handoff. Picture models: GPT Image 2, the platform default, DALL\xB7E 3 and Nano Banana 2, each falling back to the platform model rather than losing a scene. Supports native 16:9 and 9:16, user-uploaded scene images, one reusable Veo motion background, model/default settings, resumable WorkspaceDB projects, and natural-language script, scene, style, and assembly changes.",icon:"Film",component:"apps/SceneForge/App.tsx"},{id:"asset-generator",name:"Asset Generator",description:"Standalone AI asset studio pre-loaded with the Netflix vs Blockbuster 6-scene storyboard. Dark two-column layout: the left column lists the six scene cards \u2014 each with its voiceover line, a live status badge (WAITING / GENERATING / DONE / ERROR), a thumbnail and its own Generate/Regenerate button \u2014 and the right column shows a large preview of the selected scene's finished 9:16 image with a Download button and the full art-directed prompt. Every scene carries a detailed hand-written image brief (subject, composition, lighting, mood \u2014 far richer than the voiceover line). 'Generate All' runs the six scenes sequentially with a progress bar and a Stop control. PLATFORM-ONLY generation (Sep 15 2026): all images are made by the asset-image-gen server function through the platform's wallet-billed image engine with durable GCS URLs \u2014 no founder-owned API keys, no BYOK, no external providers, nothing to configure. Finished URLs persist locally so the set survives a refresh.",icon:"Image",component:"apps/AssetGenerator/App.tsx"}],terminology:{reading:"reading",writing:"writing",creating:"creating",deleting:"deleting",editing:"editing"},desktop:{theme:{gradient:"from-[#101A30] to-[#0A0F1E]",accentColor:"#3B82F6",dockStyle:"glass"},themeTokens:{typography:{headingFont:"Inter",bodyFont:"Inter",fontFamily:"'Inter', 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"},shell:{accentColor:"#3B82F6",dockStyle:"glass",pageBackground:"radial-gradient(1100px 560px at 50% -10%, rgba(59,130,246,0.18), transparent 60%), #0A0F1E",gateBackground:"radial-gradient(1200px 620px at 50% -12%, rgba(59,130,246,0.20), transparent 62%), #0A0F1E",panelBackground:"rgba(16,24,42,0.92)",panelStrongBackground:"#18243A"},cssVariables:{"--space-surface-bg":"#0A0F1E","--space-surface-gradient-from":"#101A30","--space-surface-gradient-via":"#0A0F1E","--space-surface-gradient-to":"#0D1528","--space-surface-card":"#10182A","--space-surface-panel":"#121C30","--space-surface-panel-strong":"#18243A","--space-surface-muted":"#111B2E","--space-surface-accent-soft":"rgba(59,130,246,0.16)","--space-border-default":"rgba(148,163,184,0.16)","--space-border-strong":"rgba(148,163,184,0.28)","--space-text-primary":"#F8FAFC","--space-text-secondary":"#CBD5E1","--space-text-muted":"#94A3B8","--space-text-brand":"#60A5FA","--space-text-accent":"#     <!-- Hide loader when React renders -->
    <script>

        var loader = document.getElementById('space-loader');

        // Global error handler for uncaught JS errors (outside React boundary)

        // "is not defined" / "Cannot read properties of undefined" runtime
        // failures in the published bundle back to the server. These are
        // the failure shapes produced when the build cache survives past
        // a source change (deleted file referenced from cached bundle,
        // identifier rename in cached bundle, etc). The server responds
        // by clearing the compile cache and republishing — a one-shot
        // self-heal that prevents the multi-hour outages of 2026-04-22.
        // Sent via sendBeacon (or fetch keepalive fallback) so the
        // request survives the page reload the user is about to trigger.
        // Task #2797: lightweight breadcrumb trail — the last few visitor
        // interactions (clicks + route changes) preceding a crash. Only
        // short labels / paths are kept, never input values or query strings.

        }
        pushCrumb({ route: pathOnly(location.pathname), at: Date.now() });

          } catch (_e) {}

        });
        window.addEventListener('popstate', function() {
          pushCrumb({ route: pathOnly(location.pathname), at: Date.now() });
        });

        // Task #4977: the one-shot flag used to be page-wide, so an earlier
        // unhandled error silenced every later report — including the class
        // this beacon was blind to until now: a crash a React error boundary
        // caught (those never reach `window`, so they never got here at all).
        // The gate is now per source: at most one unhandled report, plus a
        // small capped number of boundary reports deduped by message, so a
        // crash loop still cannot flood the store.

        var __boundarySeen = {};

            }

            // stale-cache class of failure. Other errors (network, image
            // 404s, application-level exceptions) are not actionable here.

              /is not defined/i.test(text) ||

              /Cannot read properties of undefined/i.test(text) ||
              /Cannot read property .* of undefined/i.test(text);
            if (!stale) return;
            if (source === 'boundary') {
              __boundarySeen[text.slice(0, 200)] = true;
              __boundaryReportCount++;
            } else {
              __runtimeErrorReported = true;
            }
            var spaceId = "workspace-660069";
            if (!spaceId) return;
            var url = '/api/space/' + encodeURIComponent(spaceId) + '/runtime-error';

              message: text.slice(0, 500),
              line: line || null,
              source: source,
              componentStack: opts.componentStack ? String(opts.componentStack).slice(0, 2000) : null,

        // Error boundaries (the shell template's, and the inline ones this
        // compiler emits) call this directly with the component stack and the
        // crashed app's name; the serve-time reporter injected into already
        // published pages routes through it too, so caps, dedupe and

        };

        // Task #3522: CAPTURE-phase resource-error listener for dead images.
        //
        // Resource load failures do not bubble and carry no `message`, so the
        // bubble-phase listener directly above never sees them — and
        // reportRuntimeErrorToServer explicitly filters image 404s out anyway
        // because they are not the stale-cache class of failure it self-heals.
        // A dead <img src> therefore had no path to the server at all until a
        // founder reported it by hand.
        //
        // The browser is the right detector here: it is free, creates no
        // outbound fan-out from platform IPs, and catches hotlink protection,
        // geo blocks and user-agent filtering that a server-side HEAD would
        // either miss or misjudge. Deduped per URL and hard-capped per page
        // load so a page with many dead images cannot flood the store.

        // details string (the underlying error / fetch status / stack)
        // that the user can expand via "View details". The Try-again
        // button forces a cache-busting reload so a healed upstream
        // surfaces on next request.

            '<p style="color:#64748b;margin-bottom:1.25rem;text-align:center;max-width:420px">' + reason + '</p>' +
            '<div style="display:flex;gap:0.5rem">' +
              '<button id="__audos_retry_btn" style="padding:0.5rem 1.25rem;border-radius:0.5rem;border:1px solid #6366f1;background:#6366f1;color:#fff;cursor:pointer;font-size:0.875rem;font-weight:500">Try again</button>' +
              '<button id="__audos_reload_btn" style="padding:0.5rem 1.25rem;border-radius:0.5rem;border:1px solid #cbd5e1;background:#fff;color:#0f172a;cursor:pointer;font-size:0.875rem">Refresh page</button>' +
            '</div>' +
            detailsHtml;
          document.body.appendChild(el);
          var retry = document.getElementById('__audos_retry_btn');
          if (retry) retry.onclick = function() {
            var u = new URL(window.location.href);
            u.searchParams.set('_cb', String(Date.now()));
            if (!/[?&]cdn=fallback/.test(window.location.search)) {
              u.searchParams.set('cdn', 'fallback');
            }
            try { sessionStorage.removeItem('__audos_cold_retry'); } catch(e) {}
            try { sessionStorage.removeItem('__audos_cdn_fallback'); } catch(e) {}
            window.location.replace(u.toString());
          };
          var reload = document.getElementById('__audos_reload_btn');
          if (reload) reload.onclick = function() { window.location.reload(); };
        }

        function hideLoader() {
          if (!loader || loader.classList.contains('hidden')) return;
          loader.classList.add('hidden');
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 300);
          try { sessionStorage.removeItem('__audos_cold_retry'); } catch(e) {}
          try { sessionStorage.removeItem('__audos_cdn_fallback'); } catch(e) {}
        }

        // Keep the secondary user-facing loading copy visible while the
        // root still hasn't rendered. Triggers regardless of fatalError.
        setTimeout(function() {
          if (root.children.length === 0) {
            var sec = document.getElementById('space-loader-secondary');
            if (sec) sec.style.display = 'block';
          }
        }, 5000);

        // Use MutationObserver to detect when React renders content. The
        // module script above can render before this script attaches the
        // observer, so check the current DOM first to avoid a loader flash.
        var observer = new MutationObserver(function(mutations) {
          if (root.children.length > 0) {
            hideLoader();
            observer.disconnect();
          }
        });

        if (root.children.length > 0) {
          hideLoader();
          return;
        }
        
        observer.observe(root, { childList: true });
        // Task #4714: the give-up deadline is progress-aware. A slow mobile
        // connection is not a broken page: until document.readyState reaches
        // 'complete' the browser is still downloading and evaluating the
        // bundle, so the deadline is deferred instead of spent. ('complete',
        // not 'loading': browsers flip to 'interactive' as soon as the markup
        // is parsed, while the inline module and its ~100 esm.sh imports are
        // still in flight — that is precisely the healthy-but-slow case.)
        // Once loading genuinely finishes we still allow a grace window for
        // React's first paint (measured ~1s after load completes) before
        // declaring failure, and an absolute ceiling guarantees a page that
        // never finishes loading (e.g. an unreachable CDN that keeps the
        // module graph pending) still recovers on its own.
        window.__audos_shell_progress_aware__ = 1;
        var __shellDeadlineStart = Date.now();
        var __SHELL_BASE_DEADLINE_MS = 8000;
        var __SHELL_POST_LOAD_GRACE_MS = 5000;
        var __SHELL_ABSOLUTE_CEILING_MS = 60000;
        var __SHELL_LOADING_POLL_MS = 500;
        var __shellLoadingDoneAt = (document.readyState === 'complete') ? Date.now() : 0;
        document.addEventListener('readystatechange', function() {
          if (!__shellLoadingDoneAt && document.readyState === 'complete') {
            __shellLoadingDoneAt = Date.now();
          }
        });
        window.addEventListener('load', function() {
          if (!__shellLoadingDoneAt) __shellLoadingDoneAt = Date.now();
        });

        // Fallback: once the page has stopped making progress and still has no
        // visible content, show recovery.
        // Task #1435: surface the underlying cause via showRecovery(reason, details)
        // so the user sees the actual error, not just an opaque spinner.
        //
        // Auto-reload guard: _cb in the URL is the primary "already retried"
        // marker. sessionStorage alone fails open in mobile private mode and
        // in-app webviews (including ChatGPT's), which previously caused an
        // infinite _cb= reload loop and 100% mobile bounce on slow pages.
        function __shellGiveUp() {
          var isTopLevel = (window === window.parent);
          // Product Run / tenant delegation iframe. Apps often mount with
          // position:fixed (out of #root's document flow), so #root.offsetHeight
          // stays ~0 even when the calendar is fully visible. Never auto-reload
          // or empty-overlay that surface — that is the Bipp "refresh" bug.
          var isDelegatedProductRun = !!(window.__TENANT_DELEGATION__ || window.__TENANT_DELEGATION_CANVAS__);
          var usingCdnFallback = /[?&]cdn=fallback/.test(window.location.search);
          var hasCacheBuster = /[?&]_cb=/.test(window.location.search);
          var alreadyTriedCdn = false;
          try { alreadyTriedCdn = !!sessionStorage.getItem('__audos_cdn_fallback'); } catch(e) {}

          // CDN fallback helper: redirect with ?cdn=fallback so the server
          // rewrites the import map from esm.sh to cdn.jsdelivr.net.
          // Top-level pages only — never Product Run iframes (location.replace
          // remounts the whole calendar) and never generic preview iframes.
          // URL cdn=fallback is the durable guard; sessionStorage is secondary.
          function tryCdnFallback() {
            if (!isTopLevel || isDelegatedProductRun || usingCdnFallback || alreadyTriedCdn) return false;
            try { sessionStorage.setItem('__audos_cdn_fallback', String(Date.now())); } catch(e) {}
            var u = new URL(window.location.href);
            u.searchParams.set('cdn', 'fallback');
            u.searchParams.set('_cb', String(Date.now()));
            window.location.replace(u.toString());
            return true;
          }

          if (fatalError) {
            // fatalError may still take one CDN hop even if _cb is present.
            if (tryCdnFallback()) return;
            showRecovery('A script error prevented the page from loading.', fatalError);
            return;
          }
          if (root.children.length === 0) {
            // Primary guard: _cb already in the URL means we already auto-reloaded.
            // Secondary: sessionStorage when available. Manual Retry button clears both.
            var alreadyRetried = hasCacheBuster;
            if (!alreadyRetried) {
              try { alreadyRetried = !!sessionStorage.getItem('__audos_cold_retry'); } catch(e) {}
            }

            if (isTopLevel && !alreadyRetried) {
              // Step 1: cold-start retry (warm the compile cache) — at most once.
              try { sessionStorage.setItem('__audos_cold_retry', String(Date.now())); } catch(e) {}
              var u = new URL(window.location.href);
              u.searchParams.set('_cb', String(Date.now()));
              window.location.replace(u.toString());
              return;
            }
            // Step 2: CDN fallback — esm.sh may be unreachable. Do not burn a
            // second reload after the _cb cold-retry hop.
            if (!hasCacheBuster && tryCdnFallback()) return;
            showRecovery('The page failed to load. This may be a network or regional issue.', 'No content rendered in the root element after the document stopped loading. The application bundle may have failed to evaluate.');
            return;
          }
          // Product Run: React mounted (children present). Fixed-position app
          // canvases leave #root at 0 height — that is success, not emptiness.
          if (isDelegatedProductRun) {
            hideLoader();
            return;
          }
          // Check if rendered content has any visible height
          var hasVisibleContent = root.offsetHeight > 50 || root.scrollHeight > 50;
          if (!hasVisibleContent) {
            showRecovery('The page loaded but appears empty.', 'The root element has children but no visible height. The component tree may have rendered null.');
            return;
          }
          // Hide loader if still showing
          hideLoader();
        }

        function __scheduleShellGiveUp(delay) {
          setTimeout(function() {
            var now = Date.now();
            // A hard script error is not "still loading" — recover right away.
            if (fatalError) { __shellGiveUp(); return; }
            // Absolute ceiling: never spin forever.
            if (now - __shellDeadlineStart >= __SHELL_ABSOLUTE_CEILING_MS) { __shellGiveUp(); return; }
            // Something rendered — the remaining checks (visible height,
            // Product Run) must still run on the normal schedule.
            if (root.children.length > 0) { __shellGiveUp(); return; }
            // Still downloading/evaluating: progress is being made, wait.
            if (document.readyState !== 'complete') {
              __scheduleShellGiveUp(__SHELL_LOADING_POLL_MS);
              return;
            }
            if (!__shellLoadingDoneAt) __shellLoadingDoneAt = now;
            var sinceLoaded = now - __shellLoadingDoneAt;
            if (sinceLoaded < __SHELL_POST_LOAD_GRACE_MS) {
              __scheduleShellGiveUp(__SHELL_POST_LOAD_GRACE_MS - sinceLoaded);
              return;
            }
            __shellGiveUp();
          }, delay);
        }
        __scheduleShellGiveUp(__SHELL_BASE_DEADLINE_MS);
      })();
    </script>
  </body>
</html>
